name: Schemathesis (manual)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "BASE_URL API yang diuji (mock/staging)"
        required: true
        default: "http://localhost:8080"
      max_examples:
        description: "Contoh per operasi"
        required: false
        default: "25"

permissions:
  contents: read

jobs:
  schemathesis:
    runs-on: ubuntu-latest
    env:
      SCHEMATHESIS_TELEMETRY: "off"
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install schemathesis
      - name: Jalankan Schemathesis
        env:
          GH_TOKEN: ${{ secrets.BACKEND_READ_TOKEN }}
          BASE_URL: ${{ inputs.base_url }}
          MAX_EXAMPLES: ${{ inputs.max_examples }}
          TOKEN: ${{ secrets.TITENY_TEST_JWT }}
        run: contract/schemathesis.sh
